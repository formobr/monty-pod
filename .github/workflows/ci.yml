name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    # Pinned, not ubuntu-latest: a new ubuntu-latest must not move the runner under the tests. ffmpeg itself is
    # the BtbN n6.1.3 build the pod image pins (Dockerfile FFMPEG_ASSET), downloaded below.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      # render/goldens/leak tests run without the ml extras — that's by design,
      # the ml stack only matters inside the baked image.
      - run: python contracts/validate.py
      # MISC-309: tests spawn `ffmpeg`, and the runner image's own published software list carries none.
      # Not apt: the runner's apt mirror hung this step for 25 min (run 45343931932) and it has no bound.
      # This takes the SAME pinned BtbN asset the pod image does (Dockerfile FFMPEG_BUILD / FFMPEG_ASSET, read
      # from the Dockerfile so the two cannot drift), with a bounded download and a step timeout.
      # tests/test_ci_installs_what_tests_need.py fails the local gate if this step goes missing.
      - name: Install ffmpeg
        timeout-minutes: 10
        run: |
          FFMPEG_BUILD=$(sed -n "s/^ARG FFMPEG_BUILD=//p" Dockerfile)
          FFMPEG_ASSET=$(sed -n "s/^ARG FFMPEG_ASSET=//p" Dockerfile)
          test -n "$FFMPEG_BUILD"
          test -n "$FFMPEG_ASSET"
          curl -fL --retry 3 --max-time 300 -o "$RUNNER_TEMP/ffmpeg.tar.xz" "https://github.com/BtbN/FFmpeg-Builds/releases/download/$FFMPEG_BUILD/$FFMPEG_ASSET"
          mkdir "$RUNNER_TEMP/ffmpeg-dist"
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg-dist" --strip-components=1
          sudo install -m 0755 "$RUNNER_TEMP/ffmpeg-dist"/bin/ffmpeg "$RUNNER_TEMP/ffmpeg-dist"/bin/ffprobe /usr/local/bin
          ffmpeg -version
      - run: pytest -q

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # MISC-12: two pushes to main must never build and publish at once over the one shared `:buildcache`
    # tag. One publish per ref at a time; a new publish waits behind the running one and never cancels it.
    concurrency:
      group: image-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Instrument instead of pre-emptively deleting. A `free-disk-space` step used to run here and cost
      # 186s of a 545s job — a third of the build — reclaiming 26GiB on a runner that started with 88GiB
      # free and a build that peaks around 15GiB. If a build ever does hit ENOSPC, this line is the first
      # thing in the log and says so; that is cheaper than paying three minutes on every tag against a
      # failure that has never happened.
      - run: df -h /
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # REGISTRY cache, not `type=gha`, and mode=max, not min — both are forced, not preference:
          #   • the registry cache is shared across main commits whose immutable SHA tags must all publish.
          #   • the costly work (apt+CUDA repo 54s, `pip install torch` 108s) lives in the `pydeps`
          #     BUILDER stage. mode=min exports only the final image's layers, so buildkit would have to
          #     re-run pydeps to learn what `COPY --from=pydeps` even resolves to. Only mode=max keeps it.
          # Re-export is near-free on a code-only commit: blobs already in the registry are matched by digest
          # and skipped, so what gets pushed is the manifest, not the 4 GB again.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max
          # The image can then NAME ITSELF in a refusal ("image <sha> does not carry op X"), which is the
          # first thing anyone reading that error needs to know.
          build-args: |
            IMAGE_TAG=${{ github.sha }}
            IMAGE_REVISION=${{ github.sha }}
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
