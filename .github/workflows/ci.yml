name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      # render/goldens/leak tests run without the ml extras — that's by design,
      # the ml stack only matters inside the baked image.
      - run: python contracts/validate.py
      - run: pytest -q

  image:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Instrument instead of pre-emptively deleting. A `free-disk-space` step used to run here and cost
      # 186s of a 545s job — a third of the build — reclaiming 26GiB on a runner that started with 88GiB
      # free and a build that peaks around 15GiB. If a build ever does hit ENOSPC, this line is the first
      # thing in the log and says so; that is cheaper than paying three minutes on every tag against a
      # failure that has never happened.
      - run: df -h /
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # REGISTRY cache, not `type=gha`, and mode=max, not min — both are forced, not preference:
          #   • the Actions cache is scoped per ref, and this job only ever runs on a `v*` TAG. A cache
          #     written under tag v0.12.0 is unreadable from tag v0.13.0, so type=gha would miss every
          #     single time while looking like it works.
          #   • the costly work (apt+CUDA repo 54s, `pip install torch` 108s) lives in the `pydeps`
          #     BUILDER stage. mode=min exports only the final image's layers, so buildkit would have to
          #     re-run pydeps to learn what `COPY --from=pydeps` even resolves to. Only mode=max keeps it.
          # Re-export is near-free on a code-only tag: blobs already in the registry are matched by digest
          # and skipped, so what gets pushed is the manifest, not the 4 GB again.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max
          # The image can then NAME ITSELF in a refusal ("image v0.6.2 does not carry op X"), which is the
          # first thing anyone reading that error needs to know.
          build-args: |
            IMAGE_TAG=${{ github.ref_name }}
            IMAGE_REVISION=${{ github.sha }}
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
